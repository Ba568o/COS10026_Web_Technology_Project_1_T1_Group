<!-- =============================================
  COMPONENT: SUBMIT SECTION
  Author: Sy Tho Nguyen (105705546)
  Description: Acknowledgement of Country, terms checkbox,
               submit and reset buttons
  Usage: Place inside <form class="apply-form"> as last fieldset
  ============================================= -->

<fieldset class="form-section" id="submit-section">
  <legend>Review &amp; Submit</legend>

  <!-- Acknowledgement of Country -->
  <div class="acknowledgement">
    <h3>Acknowledgement of Country</h3>
    <p>We acknowledge the Traditional Owners of the land on which we work and live,
      and pay our respects to Elders past, present and emerging.</p>
  </div>

  <!-- Terms and Conditions Checkbox -->
  <div class="form-group form-group-full">
    <label class="checkbox-label terms-label">
      <input type="checkbox" id="terms" name="terms" required aria-required="true">
      I confirm that all information provided is accurate and I agree to the
      <a href="#" target="_blank">terms and conditions</a>. <span class="required">*</span>
    </label>
  </div>

  <!-- Submit and Reset Buttons -->
  <div class="form-buttons">
    <button type="reset" class="btn btn-reset">Reset Form</button>
    <button type="submit" class="btn btn-submit">Submit Application</button>
  </div>
</fieldset>
