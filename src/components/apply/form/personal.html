<!-- =============================================
  COMPONENT: PERSONAL INFORMATION FORM SECTION
  Author: Sy Tho Nguyen (105705546)
  Description: First name, last name, DOB, gender,
               email, phone fields with HTML5 validations
  Usage: Place inside <form class="apply-form">
  ============================================= -->

<fieldset class="form-section" id="personal-info">
  <legend>Personal Information</legend>

  <!-- Row 1: First Name + Last Name -->
  <div class="form-row">
    <div class="form-group">
      <label for="first-name">First Name <span class="required">*</span></label>
      <input type="text" id="first-name" name="first_name"
        placeholder="e.g. Sy Tho"
        pattern="[A-Za-z\s]{2,50}"
        title="Only letters and spaces, 2-50 characters"
        maxlength="50"
        required
        aria-required="true">
    </div>

    <div class="form-group">
      <label for="last-name">Last Name <span class="required">*</span></label>
      <input type="text" id="last-name" name="last_name"
        placeholder="e.g. Nguyen"
        pattern="[A-Za-z\s]{2,50}"
        title="Only letters and spaces, 2-50 characters"
        maxlength="50"
        required
        aria-required="true">
    </div>
  </div>

  <!-- Row 2: Date of Birth + Gender -->
  <div class="form-row">
    <div class="form-group">
      <label for="dob">Date of Birth <span class="required">*</span></label>
      <input type="date" id="dob" name="date_of_birth"
        required
        aria-required="true">
    </div>

    <div class="form-group">
      <label>Gender <span class="required">*</span></label>
      <div class="radio-group" role="radiogroup" aria-label="Gender selection">
        <label class="radio-label">
          <input type="radio" name="gender" value="male" required> Male
        </label>
        <label class="radio-label">
          <input type="radio" name="gender" value="female"> Female
        </label>
        <label class="radio-label">
          <input type="radio" name="gender" value="other"> Other
        </label>
      </div>
    </div>
  </div>

  <!-- Row 3: Email + Phone -->
  <div class="form-row">
    <div class="form-group">
      <label for="email">Email Address <span class="required">*</span></label>
      <input type="email" id="email" name="email"
        placeholder="e.g. example@email.com"
        required
        aria-required="true">
    </div>

    <div class="form-group">
      <label for="phone">Phone Number <span class="required">*</span></label>
      <input type="tel" id="phone" name="phone"
        placeholder="e.g. 0412 345 678"
        pattern="[0-9\s\+\-]{8,15}"
        title="8-15 digits, spaces, + or - allowed"
        required
        aria-required="true">
    </div>
  </div>
</fieldset>
