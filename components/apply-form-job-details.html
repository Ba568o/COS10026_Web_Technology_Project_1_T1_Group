<!-- =============================================
  COMPONENT: JOB APPLICATION DETAILS FORM SECTION
  Author: Sy Tho Nguyen (105705546)
  Description: Job reference number (5 alphanumeric),
               position select, skills checkboxes,
               other skills textarea
  Usage: Place inside <form class="apply-form">
  ============================================= -->

<fieldset class="form-section" id="job-details">
  <legend>Job Application Details</legend>

  <!-- Row: Job Reference + Preferred Position -->
  <div class="form-row">
    <div class="form-group">
      <label for="job-ref">Job Reference Number <span class="required">*</span></label>
      <input type="text" id="job-ref" name="job_reference"
        placeholder="e.g. AB123"
        pattern="[A-Za-z0-9]{5}"
        title="Exactly 5 alphanumeric characters (e.g. AB123)"
        maxlength="5"
        required
        aria-required="true">
    </div>

    <div class="form-group">
      <label for="position">Preferred Position <span class="required">*</span></label>
      <select id="position" name="position" required aria-required="true">
        <option value="" disabled selected>-- Select Position --</option>
        <option value="president">President</option>
        <option value="vice-president">Vice President</option>
        <option value="manager">Manager</option>
        <option value="developer">Developer</option>
        <option value="designer">Designer</option>
      </select>
    </div>
  </div>

  <!-- Key Skills Checkboxes -->
  <div class="form-group form-group-full">
    <label>Key Skills <span class="required">*</span></label>
    <div class="checkbox-group" role="group" aria-label="Select your key skills">
      <label class="checkbox-label">
        <input type="checkbox" name="skills[]" value="html-css"> HTML/CSS
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="skills[]" value="javascript"> JavaScript
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="skills[]" value="php"> PHP
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="skills[]" value="sql"> SQL/Database
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="skills[]" value="python"> Python
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="skills[]" value="project-management"> Project Management
      </label>
    </div>
  </div>

  <!-- Other Skills Textarea -->
  <div class="form-group form-group-full">
    <label for="other-skills">Other Skills &amp; Qualifications</label>
    <textarea id="other-skills" name="other_skills"
      rows="5"
      placeholder="Describe any additional skills, certifications, or relevant experience..."
      maxlength="500"
      aria-describedby="other-skills-help"></textarea>
    <small id="other-skills-help" class="form-help">Maximum 500 characters</small>
  </div>
</fieldset>
